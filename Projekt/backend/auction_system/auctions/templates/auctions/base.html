<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}System aukcyjny{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'auction-list-page' %}">
                System aukcyjny MVC
            </a>

            <div>
                <a class="btn btn-outline-light btn-sm" href="{% url 'auction-list-page' %}">
                    Aukcje
                </a>
                <a class="btn btn-success btn-sm" href="{% url 'auction-create-page' %}">
                    Dodaj aukcję
                </a>
            </div>
        </div>
    </nav>

    <main class="container">
        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-success">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}

        {% block content %}
        {% endblock %}
    </main>
</body>

</html>
